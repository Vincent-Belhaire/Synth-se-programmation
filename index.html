écuter au robot.", "explanation": "« Allumer la LED en vert » est une instruction de commande. Une mesure apporte une valeur ; une condition pose une question à laquelle on répond par vrai ou faux."}, {"id": "v3", "cat": "vocab", "title": "Recevoir une information", "type": "choice", "prompt": "Quel composant du mBot fournit au programme une mesure de distance ?", "options": ["Un moteur", "La LED", "Le capteur à ultrasons", "Le buzzer"], "answer": 2, "hint": "Un capteur renseigne le programme sur l’environnement du robot.", "explanation": "Le capteur à ultrasons fournit une mesure de distance. Les moteurs, les LED et le buzzer sont des actionneurs : ils réalisent des actions commandées par le programme."}, {"id": "v4", "cat": "vocab", "title": "Une condition a deux résultats", "type": "choice", "prompt": "Dans « si la distance est inférieure à 20 cm », que renvoie le test « distance < 20 cm » ?", "options": ["Toujours une distance en centimètres", "Une durée en secondes", "Une couleur", "Vrai ou faux"], "answer": 3, "hint": "La mesure est comparée à une limite ; le test ne renvoie pas la mesure elle-même.", "explanation": "Une condition est une expression dont le résultat est vrai ou faux. Par exemple, avec 12 cm, « distance < 20 cm » est vrai ; avec 25 cm, c’est faux."}, {"id": "s1", "cat": "sequence", "title": "La dernière commande compte", "type": "choice", "prompt": "Quelle est la couleur de la LED lorsque ce programme arrive à sa fin ?", "context": "La LED est éteinte au départ. Aucun autre programme ne commande la LED.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "action", "text": "Allumer la LED en rouge"}, {"kind": "wait", "text": "Attendre 1 s"}, {"kind": "action", "text": "Allumer la LED en vert"}, {"kind": "wait", "text": "Attendre 2 s"}, {"kind": "action", "text": "Allumer la LED en bleu"}], "options": ["Rouge", "Verte", "Bleue", "Éteinte"], "answer": 2, "hint": "Lis les instructions de haut en bas. La fin du programme n’est pas une instruction « éteindre ».", "explanation": "La dernière commande de LED est « allumer en bleu ». La LED garde cet état tant qu’une nouvelle commande ne le change pas."}, {"id": "s2", "cat": "sequence", "title": "Attendre ne veut pas dire arrêter", "type": "choice", "prompt": "Que fait le robot pendant l’instruction « attendre 3 s » ?", "context": "Le robot est posé sur le sol, les roues peuvent tourner librement et aucun autre programme ne commande les moteurs.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "action", "text": "Commander les moteurs pour avancer"}, {"kind": "wait", "text": "Attendre 3 s"}, {"kind": "action", "text": "Arrêter les moteurs"}], "options": ["Il s’arrête dès que l’attente commence", "Il continue d’avancer", "Il recule", "Il vérifie automatiquement la distance"], "answer": 1, "hint": "Une attente retarde l’instruction suivante. Cherche si elle envoie aussi une nouvelle commande aux moteurs.", "explanation": "Les moteurs continuent d’exécuter la commande d’avancer pendant l’attente. L’arrêt intervient quand le programme exécute ensuite « arrêter les moteurs »."}, {"id": "s3", "cat": "sequence", "title": "Construire un signal lumineux", "type": "order", "prompt": "Remets les instructions dans l’ordre pour qu’au démarrage la LED s’allume en vert pendant 2 secondes, puis s’éteigne.", "context": "La LED est éteinte au départ. Utilise chaque instruction une seule fois.", "options": ["Éteindre la LED", "Attendre 2 s", "Au démarrage", "Allumer la LED en vert"], "answer": [2, 3, 1, 0], "hint": "Place d’abord le déclenchement. L’attente doit se trouver entre le changement de couleur et l’extinction.", "explanation": "L’ordre est : au démarrage, allumer en vert, attendre 2 s, éteindre. L’attente maintient la LED verte pendant la durée demandée."}, {"id": "s4", "cat": "sequence", "title": "Additionner les attentes", "type": "number", "prompt": "Quelle est la durée totale des instructions d’attente, en secondes ?", "context": "On compte title": "Une possibilité suffit avec OU", "type": "choice", "prompt": "Quelle commande le programme exécute-t-il ?", "context": "Au moment du test, la distance vaut 28 cm et le bouton est appuyé.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "if", "text": "Si (distance < 20 cm) OU (bouton appuyé)", "children": [{"kind": "action", "text": "Arrêter les moteurs"}], "elseChildren": [{"kind": "action", "text": "Commander les moteurs pour avancer"}]}], "options": ["Commander les moteurs pour avancer", "Commander les moteurs pour reculer", "Arrêter les moteurs", "Exécuter les deux branches"], "answer": 2, "hint": "Avec OU, il suffit qu’au moins une des deux conditions soit vraie.", "explanation": "À 28 cm, le test de distance est faux, mais le bouton est appuyé. Faux OU vrai donne vrai : le programme commande l’arrêt. OU serait aussi vrai si les deux conditions étaient vraies."}, {"id": "c5", "cat": "conditions", "title": "Inverser un résultat avec NON", "type": "choice", "prompt": "La distance vaut 20 cm. Quel est le résultat de « NON (distance < 20 cm) » ?", "options": ["Vrai", "Faux", "20 cm", "Le robot s’arrête forcément"], "answer": 0, "hint": "Évalue d’abord ce qui est entre parenthèses, puis inverse vrai et faux.", "explanation": "« 20 < 20 » est faux. NON inverse le résultat : NON faux donne vrai. Une condition seule ne commande aucune action ; les instructions du programme déterminent ensuite quoi faire."}, {"id": "b1", "cat": "boucles", "title": "Compter les répétitions", "type": "number", "prompt": "Combien de fois l’instruction « allumer la LED en rouge » est-elle exécutée ?", "context": "La LED est éteinte au départ.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "repeat", "text": "Répéter 3 fois", "children": [{"kind": "action", "text": "Allumer la LED en rouge"}, {"kind": "wait", "text": "Attendre 1 s"}, {"kind": "action", "text": "Éteindre la LED"}, {"kind": "wait", "text": "Attendre 1 s"}]}], "answer": 3, "hint": "À chaque tour, toutes les instructions placées à l’intérieur de la boucle sont exécutées.", "explanation": "La boucle effectue 3 tours. L’instruction « allumer en rouge » se trouve une fois dans son corps : elle est donc exécutée 3 fois."}, {"id": "b2", "cat": "boucles", "title": "Dans la boucle et après la boucle", "type": "number", "prompt": "Quelle est la durée totale des instructions d’attente, en secondes ?", "context": "On compte uniquement les durées écrites dans les blocs « attendre ».", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "repeat", "text": "Répéter 4 fois", "children": [{"kind": "wait", "text": "Attendre 2 s"}]}, {"kind": "wait", "text": "Attendre 3 s"}], "answer": 11, "hint": "L’attente de 2 s est répétée. L’attente de 3 s est placée après la boucle.", "explanation": "Les quatre tours durent 4 × 2 = 8 s d’attente. L’attente finale de 3 s n’est exécutée qu’une fois : 8 + 3 = 11 s."}, {"id": "b3", "cat": "boucles", "title": "La condition est déjà vraie", "type": "number", "prompt": "Combien de bips sont émis dans cette boucle ?", "context": "Le bouton est déjà appuyé avant le premier test. Dans « répéter jusqu’à », la condition est testée avant chaque tour.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "until", "text": "Répéter jusqu’à bouton appuyé", "children": [{"kind": "action", "text": "Émettre un bip"}, {"kind": "wait", "text": "Attendre 1 s"}]}, {"kind": "action", "text": "Allumer la LED en vert"}], "answer": 0, "hint": "La boucle se répète tant que la condition d’arrêt est fausse. Examine le tout premier test.", "explanation": "La condition « bouton appuyé » est vraie dès le départ. Aucun tour n’est exécuté, donc aucun bip n’est émis dans la boucle. Le programme passe directement à la LED verte."}, {"id": "b4", "cat": "boucles", "title": "Suivre plusieurs tests", "type": "number", "prompt": "Combien de fois la LED est-elle allumée en rouge avant la sortie de la boucle ?", "context": "Aux tests successifs, la d u démarrage"}, {"kind": "repeat", "text": "Répéter 3 fois", "children": [{"kind": "wait", "text": "Attendre 1 s"}]}, {"kind": "action", "text": "Émettre un bip"}], "answer": 1, "hint": "Regarde quelles instructions sont à l’intérieur de la boucle, puis quelles instructions se trouvent après.", "explanation": "Seule l’attente est répétée 3 fois. Le bip est placé après la boucle : il est émis une seule fois, après les 3 secondes d’attente."}, {"id": "d1", "cat": "debug", "title": "Le robot ne repart plus", "type": "choice", "prompt": "On veut que le robot s’arrête si la distance est inférieure à 20 cm et avance sinon. Quelle modification permet aussi de repartir quand l’obstacle s’éloigne ?", "context": "Aux tests successifs, la distance vaut 30 cm, puis 10 cm, puis 30 cm. Aucun autre programme ne commande les moteurs.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "action", "text": "Commander les moteurs pour avancer"}, {"kind": "forever", "text": "Répéter indéfiniment", "children": [{"kind": "if", "text": "Si distance < 20 cm", "children": [{"kind": "action", "text": "Arrêter les moteurs"}]}]}], "options": ["Ajouter « sinon : commander les moteurs pour avancer » au test", "Supprimer la boucle", "Ajouter une attente de 1 s après l’arrêt seulement", "Éteindre la LED après le test"], "answer": 0, "hint": "Quand le test redevient faux, quelle instruction envoie une nouvelle commande aux moteurs ?", "explanation": "À 10 cm, le robot reçoit une commande d’arrêt. Quand la distance repasse à 30 cm, le test devient faux mais aucune instruction ne relance les moteurs. La branche « sinon : avancer » fournit cette commande."}, {"id": "d2", "cat": "debug", "title": "Rendre le clignotement visible", "type": "choice", "prompt": "On veut alterner 1 seconde allumée et 1 seconde éteinte. Quelle correction correspond précisément à ce fonctionnement ?", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "forever", "text": "Répéter indéfiniment", "children": [{"kind": "action", "text": "Allumer la LED en rouge"}, {"kind": "action", "text": "Éteindre la LED"}]}], "options": ["Ajouter une seule attente de 2 s après l’extinction", "Ajouter une attente de 1 s après l’allumage et une après l’extinction", "Supprimer l’instruction d’extinction", "Remplacer la boucle par un seul allumage"], "answer": 1, "hint": "Pour conserver un état pendant une durée donnée, l’attente doit être placée juste après la commande de cet état.", "explanation": "Il faut maintenir les deux états : allumer, attendre 1 s, éteindre, attendre 1 s, puis recommencer. Sans ces attentes, les commandes s’enchaînent rapidement et ne respectent pas les durées demandées."}, {"id": "d3", "cat": "debug", "title": "Une condition impossible", "type": "choice", "prompt": "On veut une LED rouge si le robot est trop près (moins de 10 cm) ou trop loin (plus de 30 cm). Quelle condition faut-il utiliser ?", "context": "Le programme contient actuellement « distance < 10 cm ET distance > 30 cm ».", "options": ["distance < 10 cm ET distance > 30 cm", "distance > 10 cm ET distance < 30 cm", "distance < 10 cm OU distance > 30 cm", "NON (distance < 10 cm OU distance > 30 cm)"], "answer": 2, "hint": "Une même distance ne peut pas être à la fois inférieure à 10 cm et supérieure à 30 cm.", "explanation": "Les deux situations sont alternatives : il faut OU. La LED rouge est alors commandée pour une distance inférieure à 10 cm ou supérieure à 30 cm. À exactement 10 cm ou 30 cm, cette condition est fausse."}, {"id": "d4", "cat": "debug", "title": "Choisir le bon moment pour sortir", "type": "choice", "prompt": "Le robot doit avancer jusqu’à ce que la distance soit inférieure ou égale à 15 cm, puis s’arrêter. Quelle condition doit remplacer celle de la boucle ?", "context": "La distance vaut 30 cm au départ. La condition de « répéter jusqu’à » est testée avant chaque tour.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "until", "text": "Répéter jusqu’à distance > 15 cm", "children": [{"kind": "action", "text": "Commander les moteurs pour avancer"}]}, {"kind": "action", "text": "Arrêter les moteurs"}], "options": ["distance > 15 cm", "distance = 30 cm", "distance > 30 cm", "distance ≤ 15 cm"], "answer": 3, "hint": "La condition écrite après « jusqu’à » décrit le moment où il faut quitter la boucle.", "explanation": "La condition de sortie doit être « distance ≤ 15 cm ». Avec la condition incorrecte « distance > 15 cm », elle est déjà vraie à 30 cm : le programme saute la boucle et commande aussitôt l’arrêt."}], "assessment": [{"id": "a1", "cat": "vocab", "title": "Reconnaître un programme", "type": "choice", "prompt": "Quelle proposition définit le mieux un programme informatique ?", "options": ["Une suite d’instructions écrites dans un langage de programmation et exécutables par un système", "La distance mesurée devant le robot", "L’un des moteurs du robot", "Le dessin de la coque du robot"], "answer": 0, "hint": "Pense au lien entre l’algorithme et sa traduction en blocs.", "explanation": "Un programme exprime des instructions dans un langage de programmation. Il traduit un algorithme pour qu’un système puisse l’exécuter."}, {"id": "a2", "cat": "vocab", "title": "Nommer un test", "type": "choice", "prompt": "Dans un programme, « bouton appuyé ? » est une expression qui renvoie vrai ou faux. Quel terme la désigne ?", "options": ["Un actionneur", "Une condition", "Une durée", "Un moteur"], "answer": 1, "hint": "Le résultat permet au programme de choisir quoi faire.", "explanation": "« Bouton appuyé ? » est une condition : son résultat est vrai si le bouton est appuyé et faux sinon. Le bouton fournit l’information utilisée pour ce test."}, {"id": "a3", "cat": "sequence", "title": "Calculer une durée d’attente", "type": "number", "prompt": "Quelle est la durée totale des instructions d’attente, en secondes ?", "context": "On compte uniquement les durées écrites dans les blocs « attendre ».", "blocks": [{"kind": "start", "text": "action", "text": "Allumer la LED en vert"}]}], "options": ["Rouge", "Bleue", "La LED s’éteint", "Verte"], "answer": 3, "hint": "Vérifie si l’égalité est incluse dans le signe utilisé.", "explanation": "15 n’est pas strictement inférieur à 15. La condition est fausse et la branche « sinon » commande la LED verte."}, {"id": "a6", "cat": "conditions", "title": "Décider avec OU", "type": "choice", "prompt": "Quelle commande est exécutée ?", "context": "Au moment du test, la distance vaut 45 cm et le bouton n’est pas appuyé.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "if", "text": "Si (distance < 25 cm) OU (bouton appuyé)", "children": [{"kind": "action", "text": "Arrêter les moteurs"}], "elseChildren": [{"kind": "action", "text": "Commander les moteurs pour avancer"}]}], "options": ["Arrêter les moteurs", "Commander les moteurs pour avancer", "Commander les moteurs pour reculer", "Alterner arrêt et avance"], "answer": 1, "hint": "Teste séparément les deux expressions, puis applique OU.", "explanation": "45 < 25 est faux et le bouton n’est pas appuyé : faux OU faux donne faux. Le programme exécute « sinon » et commande d’avancer."}, {"id": "a7", "cat": "boucles", "title": "Compter une instruction répétée", "type": "number", "prompt": "Combien de bips sont émis par ce programme ?", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "repeat", "text": "Répéter 4 fois", "children": [{"kind": "action", "text": "Émettre un bip"}, {"kind": "wait", "text": "Attendre 1 s"}]}, {"kind": "action", "text": "Allumer la LED en vert"}], "answer": 4, "hint": "Le bip est-il placé à l’intérieur ou après la boucle ?", "explanation": "Le bip se trouve dans le corps de la boucle et il est exécuté une fois à chacun des 4 tours : il y a 4 bips. La LED verte est ensuite commandée une seule fois."}, {"id": "a8", "cat": "boucles", "title": "Trouver la sortie de la boucle", "type": "number", "prompt": "Combien de bips sont émis avant que le programme allume la LED en vert ?", "context": "Aux tests successifs, la distance vaut 8 cm, puis 8 cm, puis 17 cm. La condition est testée avant chaque tour.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "until", "text": "Répéter jusqu’à distance > 15 cm", "children": [{"kind": "action", "text": "Émettre un bip"}, {"kind": "wait", "text": "Attendre 1 s"}]}, {"kind": "action", "text": "Allumer la LED en vert"}], "answer": 2, "hint": "La boucle recommence lorsque sa condition d’arrêt est fausse.", "explanation": "Aux deux premiers tests, 8 > 15 est faux : un tour est exécuté à chaque fois. Au troisième test, 17 > 15 est vrai : le programme quitte la boucle après 2 bips et commande la LED verte."}, {"id": "a9", "cat": "debug", "title": "Une LED reste rouge", "type": "choice", "prompt": "On veut une LED rouge quand le bouton est appuyé et verte quand il est relâché. Quelle correction faut-il apporter ?", "context": "La LED est verte au départ. Le bouton est appuyé, puis relâché. Aucun autre programme ne commande la LED.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "action", "text": "Allumer la LED en vert"}, {"kind": "forever", "text": "Répéter indéfiniment", "children": [{"kind": "if", "text": "Si bouton appuyé", "children": [{"kind": "action", "text": "Allumer la LED en rouge"}]}]}], "options": ["Remplacer la boucle par une attente de 1 s", "Supprimer la commande rouge", "Ajouter « sinon : allumer la LED en vert » au test", "Allumer la LED en bleu au démarrage"], "answer": 2, "hint": "Un test faux n’annule pas une ancienne commande. Quelle branche doit commander le nouvel état ?", "explanation": "Après l’appui, la LED reste rouge tant qu’aucune autre couleur n’est commandée. La branche « sinon : vert » permet de la remettre en vert lorsque le bouton est relâché."}, {"id": "a10", "cat": "debug", "title": "Le bip final ne se produit pas", "type": "choice", "prompt": "On veut faire exactement 5 clignotements, puis émettre un bip. Quelle modification de ce programme permet de le faire ?", "context": "La LED est éteinte au départ. Un clignotement correspond à un allumage suivi d’une extinction.", "blocks": [{"kind": "start", "text": "Au démarrage"}, {"kind": "forever", "text": "Répéter indéfiniment", "children": [{"kind": "action", "text": "Allumer la LED en bleu"}, {"kind": "wait", "text": "Attendre 1 s"}, {"kind": "action", "text": "Éteindre la LED"}, {"kind": "wait", "text": "Attendre 1 s"}]}, {"kind": "action", "text": "Émettre un bip"}], "options": ["Remplacer « répéter indéfiniment » par « répéter 5 fois »", "Placer le bip avant la boucle", "Supprimer les attentes", "Ajouter une seconde boucle infinie"], "answer": 0, "hint": "Il faut une boucle qui se termine après le nombre de clignotements demandé.", "explanation": "Une boucle « répéter 5 fois » exécute 5 clignotements puis se termine : le bip placé après devient accessible. Une boucle infinie ne permet pas d’atteindre ce bip."}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const KEY='atelier_mbot_4e_v1';
const INITIAL=()=>({version:1,progress:{},drafts:{},assessment:{answers:{},submitted:false,round:1},name:'',className:'',large:false});
let state=INITIAL(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&saved.progress&&saved.assessment){state={...INITIAL(),...saved};state.drafts=state.drafts||{};}}catch(e){storageOK=false}
let view='home',category='vocab',qIndex=0,testIndex=0,feedback=null,toastTimer=null;
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}updateSide();}
function notify(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
const icons={home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',course:'<path d="M3 4h7l2 2 2-2h7v16h-7l-2 1-2-1H3zM12 6v15"/>',training:'<path d="m4 6 5 5-5 5m9 2h7M2 2h20v20H2z"/>',lab:'<path d="M9 3h6M10 3v6L4 19q-1 2 2 2h12q3 0 2-2L14 9V3M7 15h10"/>',bilan:'<path d="M5 4h14v17H5zM9 2h6v4H9zM8 10h8M8 14h8M8 18h5"/>'};
const navItems=[['home',"Vue d'ensemble"],['course','La synthèse'],['training',"S’entraîner"],['lab','Le laboratoire'],['bilan','Mon bilan']];
function renderNav(){$('#nav').innerHTML=navItems.map(([id,title])=>`<button class="nav-btn ${view===id||view==='assessment'&&id==='bilan'?'active':''}" data-go="${id}" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg>${title}</button>`).join('');$('#breadcrumb').textContent=navItems.find(x=>x[0]===view)?.[1]||'Bilan de révision';$('#fontBtn').setAttribute('aria-pressed',state.large?'true':'false');$('#fontBtn').textContent=state.large?'Texte standard':'Agrandir le texte';document.documentElement.classList.toggle('large-text',state.large);}
function stats(){const solved=DATA.training.filter(q=>state.progress[q.id]?.correct);return {solved:solved.length,own:solved.filter(q=>state.progress[q.id].firstCorrect).length,help:solved.filter(q=>!state.progress[q.id].firstCorrect).length};}
function updateSide(){const s=stats();$('#sideCount').textContent=`${s.solved} exercice${s.solved>1?'s':''} réussi${s.solved>1?'s':''} sur ${DATA.training.length}`;$('#sideBar').style.width=(s.solved/DATA.training.length*100)+'%';}
function go(v){stopPlay();if(v==='lab')labReset();view=v;feedback=null;render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
function heading(title,desc,eyebrow='PROGRAMMATION · 4e'){return `<div class="page-head"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`}
function footer(){return `<p class="screen-foot no-print">Les réponses restent dans ce navigateur. ${storageOK?'Pense à imprimer ton bilan sur un poste partagé.':'La sauvegarde est indisponible : imprime ton bilan avant de quitter.'} <button id="resetAll">Effacer ma session</button></p>`}
function robotSVG(id='r',large=false){return `<svg viewBox="0 0 460 330" role="img" aria-label="Schéma d’un robot mobile de type mBot, avec capteur à ultrasons, deux roues, carte et LED"><defs><pattern id="${id}grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b6cdec" opacity=".5"/></pattern><linearGradient id="${id}body" x2="1" y2="1"><stop stop-color="#2889ed"/><stop offset="1" stop-color="#0758b4"/></linearGradient></defs><rect width="460" height="330" fill="url(#${id}grid)"/><ellipse cx="226" cy="267" rx="115" ry="20" fill="#bad0e9" opacity=".4"/><path d="M185 145 119 50Q230 0 341 50L274 145" fill="#1684e9" opacity=".07"/><path d="M166 99Q230 62 294 99M149 72Q230 24 310 72" fill="none" stroke="#6aabe5" stroke-width="2" stroke-dasharray="6 5"/><rect x="100" y="169" width="43" height="83" rx="14" fill="#253b51"/><rect x="313" y="169" width="43" height="83" rx="14" fill="#253b51"/><g class="robot-wheel" id="${id}wheelL"><circle cx="121" cy="211" r="24" fill="#3a5065"/><path d="M121 190v42M100 211h42" stroke="#7d92a6" stroke-width="4"/></g><g class="robot-wheel" id="${id}wheelR"><circle cx="334" cy="211" r="24" fill="#3a5065"/><path d="M334 190v42M313 211h42" stroke="#7d92a6" stroke-width="4"/></g><path d="M150 124h151l20 24v91l-22 24H151l-20-24v-91z" fill="url(#${id}body)" stroke="#0555ae" stroke-width="2"/><rect x="159" y="179" width="134" height="59" rx="8" fill="#133b63"/><rect x="201" y="190" width="47" height="37" rx="4" fill="#23303d"/><path d="M196 197h-17v18h-12M252 201h23v22M210 185v-11M224 185v-11M238 185v-11" stroke="#7aabc4" stroke-width="2" fill="none"/><circle cx="176" cy="191" r="5" fill="#c4e0f4" class="robot-led" id="${id}led1"/><circle cx="280" cy="191" r="5" fill="#c4e0f4" class="robot-led" id="${id}led2"/><rect x="161" y="118" width="132" height="52" rx="12" fill="#daedfc" stroke="#6aa2cf" stroke-width="2"/><circle cx="194" cy="144" r="21" fill="#a4bcd0"/><circle cx="194" cy="144" r="15" fill="#38516b"/><circle cx="194" cy="144" r="9" fill="#132e4d"/><circle cx="260" cy="144" r="21" fill="#a4bcd0"/><circle cx="260" cy="144" r="15" fill="#38516b"/><circle cx="260" cy="144" r="9" fill="#132e4d"/><circle cx="149" cy="178" r="4" fill="#a9d4ff"/><circle cx="305" cy="178" r="4" fill="#a9d4ff"/><circle cx="149" cy="240" r="4" fill="#a9d4ff"/><circle cx="305" cy="240" r="4" fill="#a9d4ff"/><path d="M209 250h34" stroke="#c8e5ff" stroke-width="4" stroke-linecap="round"/>${large?'<g><rect x="289" y="63" width="130" height="34" rx="8" fill="white" stroke="#d9e5f2"/><text x="354" y="85" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#20466b">Que va-t-il faire ?</text></g>':''}</svg>`}
function renderHome(){const symbols=['Aa','▶','?','↻','⌕'];return `<section class="hero"><div class="hero-copy"><span class="pill yellow">Comprendre avant de programmer</span><h1>Comprendre le code.<br><em>Prévoir le robot.</em></h1><p>Des instructions aux boucles, apprends à lire un programme et à expliquer ce que fait le mBot.</p><div class="button-row"><button class="btn" data-go="training">Commencer l’entraînement</button><button class="btn secondary" data-go="course">Relire la synthèse</button></div></div><div class="hero-art">${robotSVG('hero',true)}<div class="art-note">Un robot pour comprendre des idées réutilisables partout.</div></div></section><div class="steps-strip"><div class="step-note"><span>1</span><div><b>Je prévois</b>Je lis le programme sans deviner.</div></div><div class="step-note"><span>2</span><div><b>Je vérifie</b>Je compare avec le fonctionnement.</div></div><div class="step-note"><span>3</span><div><b>J’explique</b>Je justifie avec les bons mots.</div></div></div><div class="section-head"><div><h2>Cinq compétences à construire</h2><p class="muted small">24 exercices · des indices · des corrections expliquées</p></div><span class="pill">À ton rythme</span></div><section class="chapters">${DATA.categories.map((c,i)=>{const qs=DATA.training.filter(q=>q.cat===c.id);const n=qs.filter(q=>state.progress[q.id]?.correct).length;return `<button class="card chapter" data-cat="${c.id}"><span class="chapter-icon" aria-hidden="true">${symbols[i]}</span><h3>${esc(c.short)}</h3><p>${esc(c.description)}</p><div class="count">${n} / ${qs.length} exercices réussis</div></button>`}).join('')}</section><section class="card callout-lab"><div><h3>Une condition change. Que fait le robot ?</h3><p>Manipule la distance, suis les instructions et observe les boucles dans le laboratoire.</p></div><button class="btn secondary" data-go="lab">Ouvrir le laboratoire</button></section>${footer()}`}
function blocksHTML(blocks){return `<div class="program" aria-label="Programme simplifié">${(blocks||[]).map(b=>`<div class="block ${esc(b.kind)}"><div>${esc(b.text)}</div>${b.children?`<div class="nested">${blocksHTML(b.children)}</div>`:''}${b.elseChildren?`<div class="branch-label">sinon</div><div class="nested">${blocksHTML(b.elseChildren)}</div>`:''}${b.children?'<div class="end-label">fin du bloc</div>':''}</div>`).join('')}</div>`}
function renderCourse(){return `${heading('La synthèse à retenir','Les mots et les structures pour lire, expliquer et corriger un programme. Les blocs ci-dessous sont simplifiés pour travailler le raisonnement.')}<div class="button-row no-print" style="margin-bottom:22px"><button class="btn secondary" id="printCourse">Imprimer la synthèse</button><button class="btn" data-go="training">Passer aux exercices</button></div><div class="content-grid"><div><section class="card lesson"><h2>Donner du sens aux mots</h2><dl><dt>Algorithme</dt><dd>Une suite organisée d’instructions qui décrit comment réaliser une tâche.</dd><dt>Programme</dt><dd>Un algorithme écrit dans un langage que la machine peut exécuter.</dd><dt>Instruction</dt><dd>Une commande du programme : allumer une LED, attendre, arrêter les moteurs…</dd><dt>Événement</dt><dd>Ce qui peut déclencher un script, par exemple le démarrage du robot.</dd><dt>Séquence</dt><dd>Des instructions exécutées dans un ordre précis.</dd></dl></section><section class="card lesson"><h2>Recevoir une information et agir</h2><table class="lesson-table"><thead><tr><th>Rôle</th><th>Exemple sur le mBot</th></tr></thead><tbody><tr><td>Entrée : fournir une information</td><td>Le capteur à ultrasons mesure une distance. Un bouton indique s’il est appuyé.</td></tr><tr><td>Traitement : décider</td><td>La carte exécute le programme et teste les conditions.</td></tr><tr><td>Sortie : produire une action</td><td>Les moteurs déplacent le robot, les LED éclairent, le buzzer émet un son.</td></tr></tbody></table></section><section class="card lesson"><h2>L’ordre des instructions compte</h2>${blocksHTML([{kind:'start',text:'Au démarrage'},{kind:'action',text:'Avancer à 40 %'},{kind:'wait',text:'Attendre 2 secondes'},{kind:'action',text:'Arrêter les moteurs'}])}<p style="margin-top:15px">Les moteurs reçoivent l’ordre d’avancer. Pendant l’attente, ils continuent. Ensuite, l’instruction d’arrêt les arrête.</p><p><strong>Attendre met ce script en pause ; cela ne commande pas l’arrêt des moteurs.</strong> Ici, « avancer » est une commande sans durée intégrée.</p><p class="small muted">40 % est un réglage de commande, pas une vitesse en km/h. Le programme décrit ici un seul script.</p></section></div><div><section class="card lesson"><h2>Choisir avec une condition</h2><p>Une <strong>condition</strong> est une expression qui peut être <strong>vraie ou fausse</strong> au moment du test.</p>${blocksHTML([{kind:'if',text:'Si distance < 20 cm',children:[{kind:'action',text:'Arrêter les moteurs'}],elseChildren:[{kind:'action',text:'Avancer à 40 %'}]}])}<p style="margin-top:13px">À 12 cm : le test est vrai, les moteurs sont arrêtés. À 20 cm : le test est faux, car <strong>&lt; signifie strictement inférieur</strong>.</p><p>Un <strong>si</strong> isolé teste une fois lorsqu’il est atteint. Dans une boucle, la condition est testée à chaque nouveau passage.</p><table class="lesson-table"><thead><tr><th>Opérateur</th><th>La condition est vraie si…</th></tr></thead><tbody><tr><td>ET</td><td>Les deux conditions sont vraies.</td></tr><tr><td>OU</td><td>Au moins une condition est vraie, y compris les deux.</td></tr><tr><td>NON</td><td>La condition placée après NON est fausse.</td></tr></tbody></table></section><section class="card lesson"><h2>Répéter avec une boucle</h2><table class="lesson-table"><thead><tr><th>Boucle</th><th>Fonctionnement</th></tr></thead><tbody><tr><td><strong>Répéter 3 fois</strong></td><td>Exécute trois fois les instructions à l’intérieur, puis passe à la suite.</td></tr><tr><td><strong>Répéter toujours</strong></td><td>Recommence sans fin tant que le programme fonctionne. La suite de cette boucle, dans le même script, n’est pas atteinte.</td></tr><tr><td><strong>Répéter jusqu’à…</strong></td><td>Teste la condition avant chaque tour. Si elle est fausse, fait un tour ; si elle est vraie, sort de la boucle. Il peut y avoir zéro tour.</td></tr></tbody></table><p style="margin-top:13px">Seules les instructions <strong>à l’intérieur</strong> sont répétées. Le retrait et l’emboîtement des blocs montrent ce qui appartient à la boucle.</p><details><summary>Un exemple à vérifier</summary><p>Répéter 3 fois [LED rouge ; attendre 1 s ; LED éteinte ; attendre 1 s] : 3 allumages et 6 s d’attente au total. Après la boucle, la LED est éteinte.</p></details></section><section class="card lesson"><h2>Ma méthode pour expliquer</h2><ol><li>Je repère le démarrage et les états de départ.</li><li>Je suis les instructions dans l’ordre.</li><li>Je décide vrai ou faux à chaque test.</li><li>Je compte les tours et repère la sortie de boucle.</li><li>Je décris les actions et justifie ma réponse.</li></ol><p><strong>Déboguer</strong>, c’est chercher une erreur, la corriger puis vérifier que le programme fait ce qui est attendu.</p></section></div></div><p class="source-note">Références techniques : <a href="https://scratch.mit.edu/help/studio/tips/blocks/repeat-until/" target="_blank" rel="noopener">Scratch · répéter jusqu’à</a><a href="https://scratch.mit.edu/help/studio/tips/blocks/if-else/" target="_blank" rel="noopener">Scratch · si / sinon</a><a href="https://support.makeblock.com/hc/en-us/articles/10708057191703-Case-8-Basic-movements" target="_blank" rel="noopener">Makeblock · déplacements mBot</a></p>${footer()}`}
function getQs(){return DATA.training.filter(q=>q.cat===category)}
function curQuestion(){return view==='assessment'?DATA.assessment[testIndex]:getQs()[qIndex]}
function getRecord(q){return state.progress[q.id]||{attempts:0,correct:false,firstCorrect:false,usedHint:false,seenCorrection:false}}
function getDraft(q,assessment=false){const existing=assessment?state.assessment.answers[q.id]:state.drafts[q.id];if(existing!==undefined)return existing;if(q.type==='order'){let d=q.options.map((_,i)=>i);if(d.every((v,i)=>v===q.answer[i]))d=[...d.slice(1),d[0]];if(!assessment)state.drafts[q.id]=d;return d}return null}
function answerUI(q,assessment){const d=getDraft(q,assessment);const rec=getRecord(q),disabled=!assessment&&rec.correct?'disabled':'';if(q.type==='choice')return `<div class="choice-list">${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${d===i?'checked':''} ${disabled}><span>${esc(o)}</span></label>`).join('')}</div>`;if(q.type==='number')return `<label class="answer-num">Ta réponse <input id="numberAnswer" type="number" step="any" inputmode="decimal" value="${d===null?'':esc(d)}" ${disabled} aria-label="Réponse numérique"></label>`;if(q.type==='order')return `<p class="small muted">Replace les instructions dans l’ordre. Utilise Monter et Descendre.</p><ol class="order-list">${d.map((idx,pos)=>`<li><span class="order-pos">${pos+1}.</span><span class="order-text">${esc(q.options[idx])}</span><span class="order-controls"><button type="button" data-move="${pos}" data-dir="-1" aria-label="Monter ${esc(q.options[idx])}" ${disabled||pos===0?'disabled':''}>Monter</button><button type="button" data-move="${pos}" data-dir="1" aria-label="Descendre ${esc(q.options[idx])}" ${disabled||pos===d.length-1?'disabled':''}>Descendre</button></span></li>`).join('')}</ol>`;return ''}
function validateAnswer(q,a){if(a===null||a===undefined||a==='')return false;if(q.type==='order')return Array.isArray(a)&&a.length===q.answer.length&&a.every((v,i)=>v===q.answer[i]);if(q.type==='number')return Number.isFinite(Number(a))&&Math.abs(Number(a)-Number(q.answer))<1e-9;return a===q.answer}
function answerText(q,a){if(a===null||a===undefined||a==='')return 'Sans réponse';if(q.type==='choice')return q.options[a]??'Sans réponse';if(q.type==='order')return a.map(i=>q.options[i]).join(' ; ');return String(a).replace('.',',')}
function exerciseHTML(q,assessment){const rec=getRecord(q);let f=feedback;if(!assessment&&rec.correct&&!f)f={type:'good',title:rec.firstCorrect?'Réussi sans aide, au premier essai':'Réussi après entraînement',text:q.explanation};return `<section class="card exercise-card"><div class="exercise-top"><h2>${esc(q.title)}</h2><span class="pill">${assessment?'Bilan · 2 points':esc(DATA.categories.find(c=>c.id===q.cat).short)}</span></div><p class="exercise-prompt">${esc(q.prompt)}</p>${q.context?`<p class="exercise-context">${esc(q.context)}</p>`:''}<div class="exercise-grid ${!q.blocks?.length?'no-code':''}">${q.blocks?.length?`<div class="code-pane"><div class="code-caption">Programme à lire · blocs simplifiés</div>${blocksHTML(q.blocks)}</div>`:''}<div><div id="answerArea">${answerUI(q,assessment)}</div>${assessment?'<p class="help-line">Ta réponse est enregistrée. La correction apparaîtra après validation des 10 questions.</p>':`<div class="button-row"><button class="btn" id="checkAnswer" ${rec.correct?'disabled':''}>Vérifier ma réponse</button><button class="btn secondary" id="showHint" ${rec.correct?'disabled':''}>${rec.usedHint?'Relire l’indice':'Un indice'}</button></div>${rec.usedHint?`<div class="hint"><strong>Indice.</strong> ${esc(q.hint)}</div>`:''}${rec.attempts>0&&!rec.correct?'<button class="quiet" id="showCorrection">Comprendre la correction</button>':''}`}</div></div>${f&&!assessment?`<div class="feedback ${f.type==='good'?'good':f.type==='neutral'?'neutral':''}" role="status"><b>${esc(f.title)}</b><p>${esc(f.text)}</p></div>`:''}</section>`}
function renderTraining(){const qs=getQs(),q=qs[qIndex];const c=DATA.categories.find(c=>c.id===category);return `${heading('S’entraîner à raisonner','Lis le programme, prévois le résultat, puis vérifie. Un indice est disponible si tu en as besoin.')}<div class="category-tabs no-print" aria-label="Compétences">${DATA.categories.map(c=>`<button class="tab-btn ${category===c.id?'active':''}" data-cat="${c.id}" ${category===c.id?'aria-current="true"':''}>${esc(c.short)}</button>`).join('')}</div><div class="question-nav no-print" aria-label="Questions de la compétence">${qs.map((x,i)=>{const r=getRecord(x);return `<button class="q-dot ${qIndex===i?'current':''} ${r.correct?(r.firstCorrect?'solved':'helped'):''}" data-q="${i}" aria-label="Exercice ${i+1}${r.correct?', réussi':''}" ${qIndex===i?'aria-current="step"':''}>${i+1}</button>`}).join('')}<span class="q-meta">${esc(c.title)} · ${qIndex+1} / ${qs.length}</span></div>${exerciseHTML(q,false)}<div class="exercise-footer no-print"><button class="btn secondary" id="prevQ" ${qIndex===0&&category==='vocab'?'disabled':''}>Précédent</button><div class="button-row"><button class="quiet" data-go="course">Relire la synthèse</button><button class="btn" id="nextQ">${qIndex===qs.length-1&&category==='debug'?'Voir mon bilan':'Suivant'}</button></div></div>${footer()}`}
function readCurrentAnswer(){const q=curQuestion();if(q.type==='choice'){const n=$('input[name=answer]:checked');return n?Number(n.value):null}if(q.type==='number')return $('#numberAnswer').value===''?null:Number($('#numberAnswer').value);return getDraft(q,view==='assessment')}
function storeDraft(){const q=curQuestion(),a=readCurrentAnswer();if(view==='assessment')state.assessment.answers[q.id]=a;else state.drafts[q.id]=a;save()}
function checkAnswer(){const q=curQuestion(),a=readCurrentAnswer();if(a===null){notify('Choisis ou saisis une réponse avant de vérifier.');return}const r=getRecord(q),ok=validateAnswer(q,a);if(r.attempts===0){r.firstAnswer=a;r.firstCorrect=ok&&!r.usedHint&&!r.seenCorrection}r.attempts++;r.lastAnswer=a;r.correct=ok;state.progress[q.id]=r;state.drafts[q.id]=a;save();feedback=ok?{type:'good',title:r.firstCorrect?'Bien raisonné ! Réussi sans aide.':'Tu as trouvé. Regarde ce qui explique la réponse.',text:q.explanation}:{type:'wrong',title:'Pas encore. Reprends le programme pas à pas.',text:typeof q.whyWrong==='string'?q.whyWrong:'Repère les instructions exécutées, les conditions et ce qui se trouve à l’intérieur des boucles. Tu peux demander un indice ou consulter la correction.'};render()}
function useHint(){const q=curQuestion(),r=getRecord(q);r.usedHint=true;state.progress[q.id]=r;save();feedback=null;render()}
function reveal(){const q=curQuestion(),r=getRecord(q);r.seenCorrection=true;state.progress[q.id]=r;save();feedback={type:'neutral',title:'Comprendre puis refaire',text:`Réponse attendue : ${answerText(q,q.answer)}. ${q.explanation}`};render()}
function changeQuestion(delta){const qs=getQs(),ci=DATA.categories.findIndex(c=>c.id===category);qIndex+=delta;if(qIndex<0){category=DATA.categories[ci-1].id;qIndex=getQs().length-1}if(qIndex>=qs.length&&delta>0){if(ci===DATA.categories.length-1){go('bilan');return}category=DATA.categories[ci+1].id;qIndex=0}feedback=null;render();$('#main').focus({preventScroll:true})}
function assessmentScore(){return DATA.assessment.reduce((s,q)=>s+(validateAnswer(q,state.assessment.answers[q.id])?2:0),0)}
function renderAssessment(){if(state.assessment.submitted)return renderAssessmentResults();const q=DATA.assessment[testIndex];return `${heading('Le bilan de révision','10 nouvelles questions pour faire le point. Tu peux revenir sur tes réponses avant de terminer.')}<div class="question-nav">${DATA.assessment.map((q,i)=>`<button class="q-dot ${i===testIndex?'current':''} ${state.assessment.answers[q.id]!=null?'done':''}" data-testq="${i}" aria-label="Question ${i+1}" ${i===testIndex?'aria-current="step"':''}>${i+1}</button>`).join('')}<span class="q-meta">${testIndex+1} / 10</span></div>${exerciseHTML(q,true)}<div class="exercise-footer"><button class="btn secondary" id="prevTest" ${testIndex===0?'disabled':''}>Précédente</button><button class="btn" id="nextTest">${testIndex===9?'Terminer le bilan':'Question suivante'}</button></div><p class="small muted" style="margin-top:20px">Ce bilan est un entraînement. Pour savoir si tu peux expliquer seul, garde la synthèse fermée jusqu’à la correction.</p>${footer()}`}
function renderAssessmentResults(){const score=assessmentScore();return `${heading('Ton bilan de révision',`Tu as obtenu ${score} / 20. Lis les explications, puis reprends les compétences à consolider.`)}<div class="stats-grid"><div class="card stat"><b>${score}/20</b><p>Résultat de ce bilan</p></div><div class="card stat"><b>${score/2}/10</b><p>Réponses correctes</p></div><div class="card stat"><b>${state.assessment.round}</b><p>Passage du bilan</p></div></div><div class="button-row no-print" style="margin-bottom:22px"><button class="btn" data-go="bilan">Mon bilan détaillé</button><button class="btn secondary" data-go="training">Reprendre l’entraînement</button></div>${DATA.assessment.map((q,i)=>reviewHTML(q,state.assessment.answers[q.id],`Question ${i+1}`)).join('')}${footer()}`}
function reviewHTML(q,a,label,extra=''){const ok=validateAnswer(q,a);return `<article class="card review"><h3>${esc(label)} · ${esc(q.title)} <span class="status-word ${ok?'':'wrong'}">${ok?'Réussi':'À reprendre'}</span></h3><p><strong>Question :</strong> ${esc(q.prompt)}</p>${q.context?`<p>${esc(q.context)}</p>`:''}${q.blocks?.length?blocksHTML(q.blocks):''}<p><strong>Réponse donnée :</strong> ${esc(answerText(q,a))}</p><p><strong>Réponse attendue :</strong> ${esc(answerText(q,q.answer))}</p><p>${esc(q.explanation)}</p>${extra}</article>`}
function skillSummary(){return DATA.categories.map(c=>{const qs=DATA.training.filter(q=>q.cat===c.id),own=qs.filter(q=>getRecord(q).correct&&getRecord(q).firstCorrect).length,help=qs.filter(q=>getRecord(q).correct&&!getRecord(q).firstCorrect).length;const score=DATA.assessment.filter(q=>q.cat===c.id).reduce((s,q)=>s+(validateAnswer(q,state.assessment.answers[q.id])?2:0),0);return `<div class="card skill-result"><div class="skill-result-head"><h3>${esc(c.title)}</h3><b>${own+help} / ${qs.length}</b></div><div class="meter" aria-label="${own} réussis seuls au premier essai, ${help} après entraînement"><span class="own" style="width:${own/qs.length*100}%"></span><span class="help" style="width:${help/qs.length*100}%"></span></div><p>${own} au premier essai sans aide · ${help} après indice, correction ou nouvel essai${state.assessment.submitted?` · Bilan : ${score}/4`:''}</p></div>`}).join('')}
function renderBilan(){const s=stats();const tried=DATA.training.filter(q=>getRecord(q).attempts>0);return `${heading('Mon bilan','Repère tes réussites et les notions à retravailler. Imprime ce bilan pour garder une trace ou le remettre au professeur.')}<div class="print-only identity-line"><strong>Élève :</strong> ${esc(state.name)||'________________________'} &nbsp; <strong>Classe :</strong> ${esc(state.className)||'________'} &nbsp; ${new Date().toLocaleDateString('fr-FR')}</div><div class="stats-grid"><div class="card stat"><b>${s.solved}/${DATA.training.length}</b><p>Exercices réussis</p></div><div class="card stat"><b>${s.own}</b><p>Réussis sans aide au premier essai</p></div><div class="card stat"><b>${state.assessment.submitted?assessmentScore()+'/20':'À faire'}</b><p>Bilan de révision · 10 questions</p></div></div><div class="no-print">${!state.assessment.submitted?`<section class="card assessment-start"><h2>Prêt à faire le point ?</h2><p>Le bilan propose <strong>10 nouvelles questions</strong>, deux par compétence. Chaque bonne réponse vaut 2 points. Les explications sont affichées à la fin.</p><p class="small muted">Un score de révision pour progresser. Il n’est pas envoyé automatiquement au professeur.</p><button class="btn" data-go="assessment">${Object.keys(state.assessment.answers).length?'Reprendre mon bilan':'Commencer le bilan'}</button></section>`:`<div class="button-row"><button class="btn" data-go="assessment">Voir la correction du bilan</button><button class="btn secondary" id="restartTest">Refaire le bilan</button></div>`}<div class="identity"><label>Prénom ou identifiant <input id="studentName" maxlength="60" placeholder="Facultatif" value="${esc(state.name)}" autocomplete="off"></label><label>Classe <input id="studentClass" maxlength="30" placeholder="Facultatif" value="${esc(state.className)}" autocomplete="off"></label></div><div class="button-row" style="margin-bottom:22px"><button class="btn secondary" id="printReport">Imprimer le bilan détaillé</button><button class="btn secondary" id="printSummary">Imprimer le résumé</button><button class="quiet" id="downloadReport">Télécharger le bilan en texte</button></div></div><h2>Les cinq compétences</h2>${skillSummary()}<p class="small muted">Le premier essai sans aide est distingué d’une réussite obtenue après un indice, une correction ou un nouvel essai. Les exercices non terminés restent à reprendre.</p><div class="report-details">${state.assessment.submitted?`<h2 style="margin-top:28px">Détail du bilan de révision</h2>${DATA.assessment.map((q,i)=>reviewHTML(q,state.assessment.answers[q.id],`Bilan ${i+1}`)).join('')}`:''}<h2 style="margin-top:28px">Détail de l’entraînement</h2>${tried.length?tried.map(q=>{const r=getRecord(q);return reviewHTML(q,r.lastAnswer,'Entraînement',`<p class="small muted">${r.attempts} essai${r.attempts>1?'s':''} · Indice ${r.usedHint?'consulté':'non consulté'} · Correction ${r.seenCorrection?'consultée':'non consultée'} · Première réponse : ${esc(answerText(q,r.firstAnswer))}</p>`)}).join(''):'<p class="muted">Tu n’as pas encore vérifié de réponse dans l’entraînement.</p>'}</div><p class="print-only small">Bilan formatif généré dans le navigateur. Il aide à repérer les acquis ; une explication personnelle permet de vérifier la compréhension.</p>${footer()}`}
function finishAssessment(){storeDraft();const missing=DATA.assessment.filter(q=>state.assessment.answers[q.id]===null||state.assessment.answers[q.id]===undefined);if(missing.length){testIndex=DATA.assessment.indexOf(missing[0]);render();notify(`Il reste ${missing.length} question${missing.length>1?'s':''} sans réponse.`);return}state.assessment.submitted=true;state.assessment.finishedAt=new Date().toISOString();save();render();window.scrollTo(0,0)}
function blocksText(bs,depth=0){return (bs||[]).map(b=>'  '.repeat(depth)+b.text+(b.children?'\n'+blocksText(b.children,depth+1):'')+(b.elseChildren?'\n'+'  '.repeat(depth)+'sinon\n'+blocksText(b.elseChildren,depth+1):'')).join('\n')}
function downloadReport(){let lines=['ATELIER MBOT — BILAN DE RÉVISION',`Élève : ${state.name||'Non renseigné'} | Classe : ${state.className||'Non renseignée'}`,`Date : ${new Date().toLocaleDateString('fr-FR')}`,''];const s=stats();lines.push(`Entraînement : ${s.solved}/${DATA.training.length} réussis, dont ${s.own} sans aide au premier essai.`,`Bilan : ${state.assessment.submitted?assessmentScore()+'/20, passage '+state.assessment.round:'non terminé'}`,'');for(const c of DATA.categories){const qs=DATA.training.filter(q=>q.cat===c.id);lines.push(c.title);for(const q of qs){const r=getRecord(q);lines.push(`- ${q.title} : ${r.correct?'réussi':'à reprendre'} ; ${r.attempts} essai(s) ; indice ${r.usedHint?'oui':'non'} ; correction ${r.seenCorrection?'oui':'non'}.`);if(r.attempts)lines.push(`  Question : ${q.prompt}`,q.context||'',blocksText(q.blocks),`  Première réponse : ${answerText(q,r.firstAnswer)}`,`  Dernière réponse : ${answerText(q,r.lastAnswer)}`,`  Attendu : ${answerText(q,q.answer)}. ${q.explanation}`)}lines.push('')}if(state.assessment.submitted){lines.push('CORRECTION DU BILAN');DATA.assessment.forEach((q,i)=>lines.push(`${i+1}. ${q.prompt}`,q.context||'',blocksText(q.blocks),`Réponse : ${answerText(q,state.assessment.answers[q.id])}`,`Attendu : ${answerText(q,q.answer)}. ${q.explanation}`,''))}lines.push('Bilan formatif local, non transmis automatiquement.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'}));a.download='Bilan_programmation_mBot.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
// Laboratoire : représentations pédagogiques, sans modèle physique du robot.
let labMode='conditions';let conditionMode='always';let labDistance=28;let labStarted=false,lastDistance=null,motor='Arrêtés',testCount=0;
let loopMode='repeat',loopTarget=3,loopPressed=false,loopPhase=0,loopTurns=0,loopTime=0,loopLed=false,loopDone=false,loopStarted=false,playTimer=null;
let waitStep=0,waitTime=0,waitMotor=false;
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null}}
function labReset(){stopPlay();labStarted=false;lastDistance=null;motor='Arrêtés';testCount=0;loopPhase=0;loopTurns=0;loopTime=0;loopLed=false;loopDone=false;loopStarted=false;waitStep=0;waitTime=0;waitMotor=false;}
function renderLab(){let body='';if(labMode==='conditions'){const b={kind:'if',text:'Si distance < 20 cm',children:[{kind:'action',text:'Arrêter les moteurs'}],elseChildren:[{kind:'action',text:'Avancer à 40 %'}]};body=`<div class="card lab-panel"><label for="conditionMode"><strong>Comment tester la condition ?</strong></label><select id="conditionMode" class="lab-select" style="margin:10px 0 18px"><option value="always" ${conditionMode==='always'?'selected':''}>Dans « répéter toujours »</option><option value="once" ${conditionMode==='once'?'selected':''}>Avec un « si » testé une seule fois</option></select>${blocksHTML([{kind:'start',text:'Au démarrage'},...(conditionMode==='always'?[{kind:'forever',text:'Répéter toujours',children:[b]}]:[b])])}<p class="small muted" style="margin-top:18px">Essaie 12 cm, 20 cm, puis 35 cm. La condition est-elle vraie ? Le programme la teste-t-il de nouveau ?</p><div class="button-row"><button class="btn" id="conditionStart">${labStarted?'Relancer le programme':'Démarrer le programme'}</button><button class="btn secondary" id="resetLab">Réinitialiser</button></div></div><div class="card lab-panel"><div class="lab-visual">${robotSVG('lab')}</div><label class="range-label" for="distance">Distance mesurée <output id="distanceOut">${labDistance} cm</output></label><input id="distance" type="range" min="0" max="80" step="1" value="${labDistance}"><div class="lab-output"><div><span>Dernier test</span><b id="lastTest">—</b></div><div><span>Commande des moteurs</span><b id="motorState">Arrêtés</b></div></div><p class="lab-log" id="conditionLog" aria-live="polite"></p><p class="small muted">Le curseur impose la mesure du capteur. Ce schéma ne calcule pas le déplacement réel. En mode boucle, chaque changement du curseur simule un nouveau test.</p></div>`;}else if(labMode==='loops'){const title=loopMode==='repeat'?`Répéter ${loopTarget} fois`:loopMode==='forever'?'Répéter toujours':'Répéter jusqu’à bouton appuyé';body=`<div class="card lab-panel"><label for="loopMode"><strong>Choisis la boucle à observer</strong></label><select id="loopMode" class="lab-select" style="margin:10px 0 18px"><option value="repeat" ${loopMode==='repeat'?'selected':''}>Répéter un nombre de fois</option><option value="until" ${loopMode==='until'?'selected':''}>Répéter jusqu’à bouton appuyé</option><option value="forever" ${loopMode==='forever'?'selected':''}>Répéter toujours</option></select>${loopMode==='repeat'?`<label class="range-label" for="turns">Nombre de tours <output>${loopTarget}</output></label><input id="turns" type="range" min="1" max="6" step="1" value="${loopTarget}">`:''}${loopMode==='until'?`<label class="lab-check"><input id="buttonPressed" type="checkbox" ${loopPressed?'checked':''}>Le bouton est appuyé</label>`:''}${blocksHTML([{kind:'start',text:'Au démarrage'},{kind:loopMode==='repeat'?'repeat':loopMode==='forever'?'forever':'until',text:title,children:[{kind:'action',text:'Allumer les LED en rouge'},{kind:'wait',text:'Attendre 0,5 seconde'},{kind:'action',text:'Éteindre les LED'},{kind:'wait',text:'Attendre 0,5 seconde'}]},{kind:'action',text:'Suite du programme'}])}<div class="button-row" style="margin-top:20px"><button class="btn" id="loopStep">Pas suivant</button><button class="btn secondary" id="loopPlay">Jouer</button><button class="quiet" id="resetLab">Recommencer</button></div></div><div class="card lab-panel"><div class="lab-visual">${robotSVG('lab')}</div><div class="lab-output"><div><span>Tours terminés</span><b id="turnCount">0</b></div><div><span>Durée d’attente cumulée</span><b id="loopTime">0 s</b></div></div><p class="lab-log" id="loopLog" aria-live="polite">Clique sur Pas suivant pour exécuter une instruction.</p><p class="small muted">La lecture est ralentie. Le compteur affiche les attentes du programme, pas le temps que tu passes à cliquer. La condition « jusqu’à » est testée avant chaque tour.</p></div>`;}else{body=`<div class="card lab-panel"><h2>Attendre ou arrêter ?</h2>${blocksHTML([{kind:'start',text:'Au démarrage'},{kind:'action',text:'Avancer à 40 %'},{kind:'wait',text:'Attendre 2 secondes'},{kind:'action',text:'Arrêter les moteurs'}])}<p style="margin-top:18px">Avant de cliquer, prévois l’état des moteurs pendant les deux secondes d’attente.</p><div class="button-row"><button class="btn" id="waitStep">Pas suivant</button><button class="btn secondary" id="resetLab">Recommencer</button></div></div><div class="card lab-panel"><div class="lab-visual">${robotSVG('lab')}</div><div class="lab-output"><div><span>Temps dans le programme</span><b id="waitTime">0 s</b></div><div><span>Commande des moteurs</span><b id="waitMotor">Arrêtés</b></div></div><p class="lab-log" id="waitLog" aria-live="polite">État initial : les moteurs sont arrêtés.</p><p class="small muted">Ici, « avancer » ne contient pas de durée. Le dessin reste fixe : l’animation représente uniquement la commande des moteurs.</p></div>`;}return `${heading('Le laboratoire des programmes','Change une donnée, suis les instructions et explique ce qui change. Aucun robot n’est nécessaire.')}<div class="category-tabs"><button class="tab-btn ${labMode==='conditions'?'active':''}" data-lab="conditions">Si ou toujours ?</button><button class="tab-btn ${labMode==='loops'?'active':''}" data-lab="loops">Compter les tours</button><button class="tab-btn ${labMode==='wait'?'active':''}" data-lab="wait">Attendre ou arrêter ?</button></div><div class="lab-grid">${body}</div>${footer()}`}
function highlightLab(text,index){$$('.lab-panel .active-block').forEach(e=>e.classList.remove('active-block'));const candidates=$$('.lab-panel .block').filter(e=>e.firstElementChild?.textContent===text);if(candidates[index||0])candidates[index||0].classList.add('active-block')}
function setRobot(moving,led=false){$$('.robot-wheel').forEach(e=>e.classList.toggle('running',moving));$$('.robot-led').forEach(e=>e.classList.toggle('led-on',led))}
function sampleCondition(){lastDistance=labDistance;testCount++;motor=labDistance<20?'Arrêtés':'Avancer à 40 %'}
function conditionUpdate(){if(!$('#lastTest'))return;$('#lastTest').textContent=lastDistance===null?'—':`${lastDistance} < 20 : ${lastDistance<20?'vrai':'faux'}`;$('#motorState').textContent=motor;$('#distanceOut').textContent=labDistance+' cm';setRobot(motor!=='Arrêtés');if(labStarted)highlightLab(motor==='Arrêtés'?'Arrêter les moteurs':'Avancer à 40 %');let s=!labStarted?'Le programme n’est pas encore démarré.':conditionMode==='once'?`La condition a été testée une seule fois, avec ${lastDistance} cm. Changer la mesure ensuite ne déclenche aucun nouveau test. Relance le programme pour tester de nouveau.`:`${testCount} test${testCount>1?'s':''} effectué${testCount>1?'s':''}. La condition est réévaluée à chaque passage dans la boucle. À ${labDistance} cm, le test est ${labDistance<20?'vrai':'faux'}.`;$('#conditionLog').textContent=s}
function loopStep(){if(loopDone)return;loopStarted=true;if(loopPhase===0){if(loopMode==='repeat'&&loopTurns>=loopTarget||loopMode==='until'&&loopPressed){loopDone=true;stopPlay();$('#loopLog').textContent=loopTurns===0?'La condition est déjà vraie : zéro tour. Le programme passe directement à la suite.':`La boucle se termine après ${loopTurns} tour${loopTurns>1?'s':''}. La suite du programme peut s’exécuter.`;$('#loopStep').disabled=true;$('#loopPlay').disabled=true;$('#loopPlay').textContent='Terminé';highlightLab('Suite du programme');return}loopLed=true;$('#loopLog').textContent=`Tour ${loopTurns+1} : allumer les LED en rouge.`}else if(loopPhase===1){loopTime+=.5;$('#loopLog').textContent=`Tour ${loopTurns+1} : attendre 0,5 seconde. Les LED restent rouges.`}else if(loopPhase===2){loopLed=false;$('#loopLog').textContent=`Tour ${loopTurns+1} : éteindre les LED.`}else{loopTime+=.5;loopTurns++;$('#loopLog').textContent=`Tour ${loopTurns} terminé : attendre 0,5 seconde, LED éteintes. Le prochain pas vérifie s’il faut recommencer.`}highlightLab(['Allumer les LED en rouge','Attendre 0,5 seconde','Éteindre les LED','Attendre 0,5 seconde'][loopPhase],loopPhase===3?1:0);loopPhase=(loopPhase+1)%4;$('#turnCount').textContent=loopTurns;$('#loopTime').textContent=String(loopTime).replace('.',',')+' s';setRobot(false,loopLed)}
function waitNext(){if(waitStep>=4)return;waitStep++;let t='';if(waitStep===1){waitMotor=true;t='Instruction « avancer » : les moteurs reçoivent la commande de tourner.'}else if(waitStep===2){waitTime=1;t='Pendant l’attente, à 1 seconde : le script attend et les moteurs continuent de tourner.'}else if(waitStep===3){waitTime=2;t='Les 2 secondes sont écoulées. Les moteurs tournent encore : l’instruction d’arrêt est la suivante.'}else{waitMotor=false;t='Instruction « arrêter les moteurs » : cette nouvelle commande arrête le robot.';$('#waitStep').disabled=true}$('#waitTime').textContent=waitTime+' s';$('#waitMotor').textContent=waitMotor?'Avancer à 40 %':'Arrêtés';$('#waitLog').textContent=t;setRobot(waitMotor);highlightLab(waitStep===1?'Avancer à 40 %':waitStep===4?'Arrêter les moteurs':'Attendre 2 secondes')}
function render(){renderNav();$('#main').innerHTML=view==='home'?renderHome():view==='course'?renderCourse():view==='training'?renderTraining():view==='lab'?renderLab():view==='assessment'?renderAssessment():renderBilan();updateSide();bind();if(view==='lab'&&labMode==='conditions')conditionUpdate();}
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;qIndex=0;go('training')});
  $$('[data-q]').forEach(b=>b.onclick=()=>{qIndex=Number(b.dataset.q);feedback=null;render()});
  $$('[data-testq]').forEach(b=>b.onclick=()=>{storeDraft();testIndex=Number(b.dataset.testq);render()});
  $$('[data-move]').forEach(b=>b.onclick=()=>{const q=curQuestion(),a=[...getDraft(q,view==='assessment')],i=Number(b.dataset.move),j=i+Number(b.dataset.dir);[a[i],a[j]]=[a[j],a[i]];if(view==='assessment')state.assessment.answers[q.id]=a;else state.drafts[q.id]=a;save();render();const target=$(`[data-move="${j}"][data-dir="${b.dataset.dir}"]`);if(target&&!target.disabled)target.focus()});
  $$('input[name=answer]').forEach(x=>x.onchange=storeDraft);if($('#numberAnswer'))$('#numberAnswer').oninput=storeDraft;
  const on=(id,fn)=>{if($(id))$(id).onclick=fn};on('#checkAnswer',checkAnswer);on('#showHint',useHint);on('#showCorrection',reveal);on('#prevQ',()=>changeQuestion(-1));on('#nextQ',()=>changeQuestion(1));on('#prevTest',()=>{storeDraft();testIndex--;render()});on('#nextTest',()=>{if(testIndex===9)finishAssessment();else{storeDraft();testIndex++;render()}});
  on('#restartTest',()=>{if(confirm('Recommencer les mêmes 10 questions ? Le résultat actuel du bilan sera remplacé. L’entraînement sera conservé.')){state.assessment={answers:{},submitted:false,round:state.assessment.round+1};testIndex=0;save();go('assessment')}});
  on('#printReport',()=>window.print());on('#printSummary',()=>{document.body.classList.add('print-summary');window.print();document.body.classList.remove('print-summary')});on('#printCourse',()=>window.print());on('#downloadReport',downloadReport);
  if($('#studentName'))$('#studentName').oninput=e=>{state.name=e.target.value;save()};if($('#studentClass'))$('#studentClass').oninput=e=>{state.className=e.target.value;save()};
  on('#resetAll',()=>{if(confirm('Effacer les réponses et le bilan sur ce navigateur ? Pense à imprimer ton bilan avant.')){state=INITIAL();category='vocab';qIndex=0;testIndex=0;labReset();save();go('home');notify('La session a été effacée.')}});
  $$('[data-lab]').forEach(b=>b.onclick=()=>{labMode=b.dataset.lab;labReset();render()});on('#resetLab',()=>{labReset();render()});
  if($('#conditionMode'))$('#conditionMode').onchange=e=>{conditionMode=e.target.value;labReset();render()};if($('#distance'))$('#distance').oninput=e=>{labDistance=Number(e.target.value);if(labStarted&&conditionMode==='always')sampleCondition();conditionUpdate()};on('#conditionStart',()=>{labStarted=true;testCount=0;sampleCondition();render()});
  if($('#loopMode'))$('#loopMode').onchange=e=>{loopMode=e.target.value;labReset();render()};if($('#turns'))$('#turns').onchange=e=>{loopTarget=Number(e.target.value);labReset();render()};if($('#buttonPressed'))$('#buttonPressed').onchange=e=>{loopPressed=e.target.checked;$('#loopLog').textContent=loopPressed?'Le bouton est appuyé. La condition sera testée avant le prochain tour.':'Le bouton n’est pas appuyé. La condition sera fausse au prochain test.'};on('#loopStep',loopStep);on('#loopPlay',()=>{if(playTimer){stopPlay();$('#loopPlay').textContent='Jouer'}else{$('#loopPlay').textContent='Pause';loopStep();if(!loopDone)playTimer=setInterval(loopStep,700)}});on('#waitStep',waitNext);
}
$('#fontBtn').onclick=()=>{state.large=!state.large;save();$('#fontBtn').setAttribute('aria-pressed',state.large?'true':'false');$('#fontBtn').textContent=state.large?'Texte standard':'Agrandir le texte';document.documentElement.classList.toggle('large-text',state.large)};
window.addEventListener('beforeprint',()=>{if(view==='bilan'){const el=$('.identity-line');if(el)el.innerHTML=`<strong>Élève :</strong> ${esc(state.name)||'________________________'} &nbsp; <strong>Classe :</strong> ${esc(state.className)||'________'} &nbsp; ${new Date().toLocaleDateString('fr-FR')}`}});
render();
</script>
</body>
</html>
